name: Deploy to GitHub Pages

on:
  push:
    branches: ['**']
  workflow_dispatch:

# Allow the GITHUB_TOKEN to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Single deploy target (one live staging site), so serialize runs across all
# branches and never cancel an in-progress deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Offline/staging build: strips the back-end (Supabase/PayFast) calls and
      # composes the pages into ui/dist. No secrets needed.
      - name: Build dev version
        run: make dev

      - name: Set staging custom domain
        run: echo "staging.wherethereslight.co.za" > ui/dist/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Deploy the composed build output, not the repo root.
          path: ui/dist

  # Staging: publish on every branch push so the live site always reflects
  # the most recent push.
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
