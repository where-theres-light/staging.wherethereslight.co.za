name: Deploy to GitHub Pages

on:
  push:
    branches: ['**']
  workflow_dispatch:

# Allow the GITHUB_TOKEN to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent run per branch; never cancel an in-progress deploy
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Build (package) the static site on every branch push so breakages are
  # caught before merging, without publishing.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # The site is static and served from the repository root
          path: '.'

  # Publish to the live site only from the default branch.
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
